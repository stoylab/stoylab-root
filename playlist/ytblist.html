<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İzleme Listesi</title>
<style>
  :root{
    --paper:#fbf7ef;
    --ink:#2a2320;
    --ink-soft:#6b615a;
    --line:#e6ddcf;
    --card:#ffffff;
    --pop:#ff6b4a;
    --pop-2:#3aa0ff;
    --radius:18px;
    --shadow:0 8px 24px rgba(42,35,32,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper);color:var(--ink);
    font-family:"Segoe UI Rounded","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif}
  body{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:840px;margin:0 auto}

  header{padding:8px 4px 18px;text-align:center}
  header h1{font-size:clamp(24px,6vw,34px);font-weight:800;letter-spacing:-.02em}

  .player-box{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);
  }
  .player-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .player-placeholder{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:#d9cfc2;padding:24px;font-weight:600;font-size:15px;line-height:1.6
  }

  .nowbar{
    display:flex;align-items:center;gap:12px;margin-top:12px;
    background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);
    min-height:56px
  }
  .nowbar .count{font-weight:800;font-size:15px;white-space:nowrap}
  .nowbar .title{color:var(--ink-soft);font-weight:600;font-size:14px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navbtn{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:var(--paper);color:var(--ink);font-size:16px;font-weight:800;
    display:grid;place-items:center;font-family:inherit
  }
  .navbtn:active{transform:scale(.92)}
  .navbtn:disabled{opacity:.3;cursor:default}

  .panel{margin-top:22px;background:var(--card);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)}
  .panel label{display:block;font-weight:800;font-size:15px;margin-bottom:4px}
  .panel .hint{color:var(--ink-soft);font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.5}
  .panel .hint code{background:var(--paper);padding:1px 6px;border-radius:5px;color:var(--ink)}
  textarea{
    width:100%;min-height:150px;resize:vertical;
    border:2px solid var(--line);border-radius:12px;padding:12px 14px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;
    color:var(--ink);background:var(--paper);line-height:1.7
  }
  textarea:focus{outline:none;border-color:var(--pop-2)}

  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{
    flex:1 1 auto;border:none;border-radius:12px;padding:15px 18px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:16px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s ease
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--pop);color:#fff;flex:2 1 200px}
  .btn-ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);flex:0 1 auto}

  .msg{margin-top:10px;font-size:13px;font-weight:700;color:var(--pop);min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>İzleme Listesi</h1></header>

  <div class="player-box">
    <div class="player-placeholder" id="ph">
      Video ID'lerini aşağıya yapıştır, sonra <strong>Oynat</strong>'a bas.<br>
      Videolar burada sırayla oynar.
    </div>
    <div id="player"></div>
  </div>

  <div class="nowbar">
    <button class="navbtn" id="prev" title="Önceki" disabled>◀</button>
    <span class="count" id="count">—</span>
    <span class="title" id="title">Liste boş</span>
    <button class="navbtn" id="next" title="Sonraki" disabled>▶</button>
  </div>

  <div class="panel">
    <label for="ids">Video ID'leri</label>
    <div class="hint">
      Her satıra bir tane. Tam link de yapıştırabilirsin, otomatik ID'ye çevrilir.<br>
      Örn: <code>KT6oCw535NI</code> ya da <code>https://youtu.be/KT6oCw535NI</code>
    </div>
    <textarea id="ids" placeholder="KT6oCw535NI&#10;https://youtu.be/abc123&#10;https://www.youtube.com/watch?v=xyz789" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="play">▶ Oynat</button>
      <button class="btn btn-ghost" id="shuffle">🔀 Karışık</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
function parseId(line){
  line = line.trim();
  if(!line) return null;
  let m = line.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(line)) return line;
  m = line.match(/([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function parseList(text){
  const seen = new Set(), out = [];
  text.split(/[\n,]/).forEach(l => {
    const id = parseId(l);
    if(id && !seen.has(id)){ seen.add(id); out.push(id); }
  });
  return out;
}

let player, ready = false, queue = [], idx = 0;

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('player', {
    height:'100%', width:'100%',
    playerVars:{ rel:0, playsinline:1, modestbranding:1 },
    events:{
      onReady: () => { ready = true; },
      onStateChange: e => { if(e.data === YT.PlayerState.ENDED) playNext(); }
    }
  });
};
(function(){
  const s = document.createElement('script');
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

const ph = document.getElementById('ph');
const countEl = document.getElementById('count');
const titleEl = document.getElementById('title');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const msg = document.getElementById('msg');

function updateBar(){
  if(!queue.length){
    countEl.textContent = "—";
    titleEl.textContent = "Liste boş";
    prevBtn.disabled = nextBtn.disabled = true;
    return;
  }
  countEl.textContent = (idx+1) + " / " + queue.length;
  titleEl.textContent = "Video " + queue[idx];
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === queue.length-1);
}
function loadCurrent(){
  if(!ready){ msg.textContent = "Oynatıcı yükleniyor, bir saniye sonra tekrar dene."; return; }
  ph.style.display = "none";
  player.loadVideoById(queue[idx]);
  updateBar();
}
function playNext(){ if(idx < queue.length-1){ idx++; loadCurrent(); } }
function playPrev(){ if(idx > 0){ idx--; loadCurrent(); } }

function start(list){
  if(!list.length){ msg.textContent = "Geçerli video ID bulunamadı."; return; }
  queue = list; idx = 0; msg.textContent = "";
  loadCurrent();
}

document.getElementById('play').addEventListener('click', () => {
  start(parseList(document.getElementById('ids').value));
});
document.getElementById('shuffle').addEventListener('click', () => {
  const l = parseList(document.getElementById('ids').value);
  for(let i=l.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [l[i],l[j]]=[l[j],l[i]]; }
  start(l);
});
prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);
</script>
</body>
</html>
